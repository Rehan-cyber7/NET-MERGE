name: Build Plexo Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  build-android:
    name: Build debug APK
    # Pin the runner during GitHub's ubuntu-latest migration to Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify local Plexo Android plugin is tracked
        shell: bash
        run: |
          set -euo pipefail
          test -f plugins/plexo-engine/package.json
          test -f plugins/plexo-engine/android/build.gradle
          test -f plugins/plexo-engine/android/src/main/AndroidManifest.xml
          test -f plugins/plexo-engine/android/src/main/java/app/plexo/engine/PlexoEnginePlugin.java
          echo "Plexo native Android plugin files are present."

      # Use the runner's sdkmanager script but install SDK packages to a
      # writable directory. Invoke it with bash; do not chmod the preinstalled SDK.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          PREINSTALLED_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$PREINSTALLED_SDK/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"

          if [[ -z "$SDKMANAGER" || ! -r "$SDKMANAGER" ]]; then
            echo "Readable sdkmanager not found under: $PREINSTALLED_SDK/cmdline-tools"
            ls -la "$PREINSTALLED_SDK/cmdline-tools" || true
            exit 1
          fi

          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Using sdkmanager: $SDKMANAGER"
          echo "Installing Android SDK into: $SDK_ROOT"

          # sdkmanager closes stdin after reading licenses; disable pipefail
          # for this pipeline so yes receiving SIGPIPE does not fail the step.
          set +o pipefail
          yes | bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail

          bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor and local Plexo plugin
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: plexo-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plexo-gradle-diagnostics
          path: |
            android/**/build/reports/**
            android/.gradle/daemon/**/daemon-*.out.log
          if-no-files-found: ignore
          retention-days: 7
