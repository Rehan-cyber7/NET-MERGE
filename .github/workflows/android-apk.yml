name: Build Plexo Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Do not chmod or modify the runner's preinstalled SDK. Invoke sdkmanager
      # through bash (so its executable bit is not needed) and install SDK
      # packages into a writable directory owned by the GitHub runner.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          PREINSTALLED_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$PREINSTALLED_SDK/cmdline-tools" -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"

          if [[ -z "$SDKMANAGER" || ! -r "$SDKMANAGER" ]]; then
            echo "Readable sdkmanager not found under: $PREINSTALLED_SDK/cmdline-tools"
            ls -la "$PREINSTALLED_SDK/cmdline-tools" || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          ls -l "$SDKMANAGER"

          # Avoid permissions/ownership problems in /usr/local/lib/android/sdk.
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          # Use bash to run the script without changing its file permissions.
          # License acceptance can close the input pipe early, so tolerate that
          # expected yes/SIGPIPE condition while still checking package install.
          set +o pipefail
          yes | bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail

          bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor and local Plexo plugin
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plexo-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
